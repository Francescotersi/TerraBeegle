services:
  postgres:
    image: postgres:17-alpine
    container_name: terrabeegle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: terrabeegle
      POSTGRES_PASSWORD: terrabeegle_secret
      POSTGRES_DB: terrabeegle_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrabeegle -d terrabeegle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
