services:
  postgres:
    image: postgres:16
    container_name: terrabeegle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER_POSTGRES}
      POSTGRES_PASSWORD: ${PASSWORD_POSTGRES}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  backend:
    build: ./Backend-TerraBeegle
    container_name: terrabeegle-backend
    restart: unless-stopped
    ports:
      - "5144:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${DB_NAME};Username=${USER_POSTGRES};Password=${PASSWORD_POSTGRES}
      EnvironmentVariables__RAWG_API_KEY: ${RAWG_API_KEY}
      EnvironmentVariables__IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      EnvironmentVariables__IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend-TerraBeegle
    container_name: terrabeegle-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ./frontend-TerraBeegle:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
