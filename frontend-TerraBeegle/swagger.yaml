          application/*+json:
            schema:
              $ref: '#/components/schemas/ResendEmailDTO'
      responses:
        '200':
          description: OK
  /api/health:
    get:
      tags:
        - Backend-TerraBeegle
      operationId: GetHealthStatus
      responses:
        '200':
          description: OK
  '/api/users/{userId}/friendship':
    get:
      tags:
        - Friendship
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Page
          in: query
          schema:
            maximum: 10000
            minimum: 1
            type: integer
            format: int32
        - name: PageSize
          in: query
          schema:
            maximum: 50
            minimum: 1
            type: integer
            format: int32
        - name: search
          in: query
          schema:
            type: string
            default: friends
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FriendshipResponseDTOPagedResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/FriendshipResponseDTOPagedResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/FriendshipResponseDTOPagedResponseDTO'
    post:
      tags:
        - Friendship
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendshipRequestDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/FriendshipRequestDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FriendshipRequestDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FriendshipResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/FriendshipResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/FriendshipResponseDTO'
    patch:
      tags:
        - Friendship
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendshipDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/FriendshipDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FriendshipDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FriendshipDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/FriendshipDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/FriendshipDTO'
  '/api/users/{userId}/friendship/{id}':
    delete:
      tags:
        - Friendship
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/games:
    get:
      tags:
        - Game
      parameters:
        - name: Page
          in: query
          schema:
            maximum: 1000000
            minimum: 1
            type: integer
            format: int32
        - name: PageSize
          in: query
          schema:
            maximum: 40
            minimum: 1
            type: integer
            format: int32
        - name: SearchPrecise
          in: query
          schema:
            type: boolean
        - name: SearchExact
          in: query
          schema:
            type: boolean
        - name: SortBy
          in: query
          schema:
            maxLength: 12
            minLength: 0
            pattern: ^(?i:name|released|added|created|updated|rating|metacritic)$
            type: string
        - name: Ascending
          in: query
          schema:
            type: boolean
        - name: Name
          in: query
          schema:
            type: string
        - name: ParentPlatforms
          in: query
          schema:
            type: string
        - name: Platforms
          in: query
          schema:
            type: string
        - name: Stores
          in: query
          schema:
            type: string
        - name: Developers
          in: query
          schema:
            type: string
        - name: Publishers
          in: query
          schema:
            type: string
        - name: Creators
          in: query
          schema:
            type: string
        - name: Genres
          in: query
          schema:
            type: string
        - name: Tags
          in: query
          schema:
            type: string
        - name: ReleaseDate
          in: query
          schema:
            type: string
        - name: Updated
          in: query
          schema:
            type: string
        - name: PlatformsCount
          in: query
          schema:
            type: integer
            format: int32
        - name: Metacritic
          in: query
          schema:
            type: string
        - name: ExcludeAdditions
          in: query
          schema:
            type: boolean
        - name: ExcludeParents
          in: query
          schema:
            type: boolean
        - name: ExcludeGameSeries
          in: query
          schema:
            type: boolean
        - name: ExcludeStores
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameSearchResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/GameSearchResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/GameSearchResponseDTO'
  /api/games/all:
    get:
      tags:
        - Game
      parameters:
        - name: Page
          in: query
          schema:
            maximum: 10000
            minimum: 1
            type: integer
            format: int32
        - name: PageSize
          in: query
