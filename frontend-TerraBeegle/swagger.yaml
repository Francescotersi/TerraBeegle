      parameters:
        - name: rawgGameId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/GameResponseDTO'
  /api/users:
    get:
      tags:
        - User
      parameters:
        - name: Page
          in: query
          schema:
            maximum: 10000
            minimum: 1
