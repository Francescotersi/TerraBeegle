            application/json:
              schema:
                $ref: '#/components/schemas/GameResponseDTOPagedResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/GameResponseDTOPagedResponseDTO'
  '/api/games/{rawgGameId}':
    get:
      tags:
