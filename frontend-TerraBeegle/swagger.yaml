            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserPublicResponseDTOPagedResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicResponseDTOPagedResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserPublicResponseDTOPagedResponseDTO'
  /api/users/search:
    get:
      tags:
        - User
      parameters:
        - name: username
          in: query
          schema:
            type: string
        - name: Page
          in: query
          schema:
            maximum: 10000
            minimum: 1
            type: integer
            format: int32
        - name: PageSize
          in: query
          schema:
            maximum: 50
            minimum: 1
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserPublicResponseDTOPagedResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicResponseDTOPagedResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserPublicResponseDTOPagedResponseDTO'
  '/api/users/{id}':
    get:
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserPublicResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserPublicResponseDTO'
    patch:
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateUserDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
    delete:
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
  /api/users/me:
    get:
      tags:
        - User
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
  '/api/users/{id}/password':
    patch:
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordDTO'
      responses:
        '200':
          description: OK
  '/api/users/{userId}/favorites':
    get:
      tags:
        - UserGames
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Page
          in: query
          schema:
            maximum: 10000
            minimum: 1
            type: integer
            format: int32
        - name: PageSize
          in: query
          schema:
            maximum: 50
            minimum: 1
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameCardDTOPagedResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/GameCardDTOPagedResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/GameCardDTOPagedResponseDTO'
  '/api/users/{userId}/favorites/{rawgGameId}':
    post:
      tags:
        - UserGames
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: rawgGameId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
    delete:
      tags:
        - UserGames
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: rawgGameId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
  '/api/users/{userId}/wishlist':
    get:
      tags:
        - UserGames
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Page
          in: query
          schema:
            maximum: 10000
            minimum: 1
            type: integer
            format: int32
        - name: PageSize
          in: query
          schema:
            maximum: 50
            minimum: 1
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameCardDTOPagedResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/GameCardDTOPagedResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/GameCardDTOPagedResponseDTO'
  '/api/users/{userId}/wishlist/{rawgGameId}':
    post:
      tags:
        - UserGames
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: rawgGameId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
    delete:
      tags:
        - UserGames
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: rawgGameId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
components:
  schemas:
    AuthResponseDTO:
      type: object
      properties:
        token:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/UserResponseDTO'
      additionalProperties: false
    FriendshipDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user1Id:
          type: integer
          format: int64
        user2Id:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/FriendshipStatus'
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    FriendshipRequestDTO:
      type: object
      properties:
        senderId:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
      additionalProperties: false
    FriendshipResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        receiverId:
          type: integer
          format: int64
        status:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    FriendshipResponseDTOPagedResponseDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FriendshipResponseDTO'
          nullable: true
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        previousPageUrl:
          type: string
          nullable: true
        nextPageUrl:
          type: string
          nullable: true
      additionalProperties: false
    FriendshipStatus:
      enum:
        - Pending
        - Accepted
        - Rejected
      type: string
    GameCardDTO:
      type: object
      properties:
        rawgGameId:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        backgroundImage:
          type: string
          nullable: true
        rating:
          type: number
          format: double
          nullable: true
        releaseDate:
          type: string
          format: date
          nullable: true
        tba:
          type: boolean
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreDTO'
          nullable: true
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/PlatformDTO'
          nullable: true
      additionalProperties: false
    GameCardDTOPagedResponseDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameCardDTO'
          nullable: true
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        previousPageUrl:
          type: string
          nullable: true
        nextPageUrl:
          type: string
          nullable: true
      additionalProperties: false
    GameResponseDTO:
      type: object
      properties:
        rawgGameId:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        nameOriginal:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        backgroundImage:
          type: string
          nullable: true
        releaseDate:
          type: string
          format: date
          nullable: true
        tba:
          type: boolean
        website:
          type: string
          nullable: true
        rating:
          type: number
          format: double
          nullable: true
        metacritic:
          type: integer
          format: int32
          nullable: true
        developer:
          type: string
          nullable: true
        publisher:
          type: string
          nullable: true
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreDTO'
          nullable: true
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/PlatformDTO'
          nullable: true
      additionalProperties: false
    GameResponseDTOPagedResponseDTO:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameResponseDTO'
          nullable: true
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        previousPageUrl:
          type: string
          nullable: true
        nextPageUrl:
          type: string
          nullable: true
      additionalProperties: false
    GameSearchResponseDTO:
      type: object
      properties:
        count:
          type: integer
          format: int32
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/GameCardDTO'
          nullable: true
      additionalProperties: false
    GenreDTO:
      type: object
      properties:
        name:
          type: string
          nullable: true
        rawgGenreId:
          type: integer
          format: int32
        slug:
          type: string
          nullable: true
      additionalProperties: false
    LoginDTO:
      required:
        - emailOrUsername
        - password
      type: object
      properties:
        emailOrUsername:
          minLength: 1
          type: string
        password:
          minLength: 1
          type: string
        code:
          maxLength: 8
          minLength: 8
          type: string
          nullable: true
      additionalProperties: false
    PlatformDTO:
      type: object
      properties:
        name:
          type: string
          nullable: true
        rawgPlatformId:
          type: integer
          format: int32
        slug:
          type: string
          nullable: true
        releasedAt:
          type: string
          nullable: true
      additionalProperties: false
    RegisterDTO:
      required:
        - confirmPassword
        - email
        - familyName
        - name
        - password
        - username
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        familyName:
          maxLength: 100
          minLength: 1
          type: string
        username:
          maxLength: 100
          minLength: 1
          pattern: '^[-a-zA-Z0-9_]+$'
          type: string
        email:
          maxLength: 255
          minLength: 1
          type: string
          format: email
        password:
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[-`~!@#$%^&*()_=+\\|/?.,;:<>\[\]{}])[-A-Za-z\d`~!@#$%^&*()_=+\\|/?.,;:<>\[\]{}]{8,}$'
          type: string
        confirmPassword:
          minLength: 1
          type: string
      additionalProperties: false
    ResendEmailDTO:
      required:
        - email
      type: object
      properties:
        email:
          maxLength: 255
          minLength: 1
          type: string
          format: email
      additionalProperties: false
    Theme:
      enum:
        - Light
        - Dark
      type: string
    UpdatePasswordDTO:
      required:
        - confirmNewPassword
        - newPassword
        - oldPassword
      type: object
      properties:
        oldPassword:
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[-`~!@#$%^&*()_=+\\|/?.,;:<>\[\]{}])[-A-Za-z\d`~!@#$%^&*()_=+\\|/?.,;:<>\[\]{}]{8,}$'
          type: string
        newPassword:
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[-`~!@#$%^&*()_=+\\|/?.,;:<>\[\]{}])[-A-Za-z\d`~!@#$%^&*()_=+\\|/?.,;:<>\[\]{}]{8,}$'
          type: string
        confirmNewPassword:
          minLength: 1
          type: string
      additionalProperties: false
    UpdateUserDTO:
      type: object
      properties:
        name:
          maxLength: 100
          type: string
          nullable: true
        username:
          maxLength: 100
          pattern: '^[-a-zA-Z0-9_]+$'
          type: string
          nullable: true
        familyName:
          maxLength: 100
          type: string
