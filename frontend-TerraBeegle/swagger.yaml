openapi: 3.0.4
info:
  title: Backend-TerraBeegle
  version: '1.0'
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/RegisterDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RegisterDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
  /api/auth/login:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
          text/json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LoginDTO'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
            text/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
  /api/auth/resend-email:
